name: Build OpenAlgo

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if image exists'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
  schedule:
    # Check for new upstream releases daily at midnight UTC
    - cron: '0 0 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: marketcalls/openalgo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch ARM64/AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Upstream Release Info
        id: upstream
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "latest")
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            UPSTREAM_TAG="latest"
          fi
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          echo "Upstream tag resolved to: $UPSTREAM_TAG"

      - name: Build and Push Docker Images via Bake
        uses: docker/bake-action@v5
        with:
          files: |
            docker-bake.hcl
          targets: openalgo
          push: true
          set: |
            *.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.UPSTREAM_TAG }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            *.args.UPSTREAM_REPO=${{ env.UPSTREAM_REPO }}
