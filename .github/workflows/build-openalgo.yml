name: Build OpenAlgo

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openalgo
  UPSTREAM_REPO: marketcalls/openalgo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Helper Repo
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Get Latest Release Tag from Upstream
        id: get_release
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest | jq -r .tag_name)
          echo "Latest release is $LATEST_RELEASE"
          echo "tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT

      - name: Checkout Upstream OpenAlgo Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.get_release.outputs.tag }}
          path: build-context

      - name: Setup Custom Dockerfile
        run: |
          cp helper/Dockerfile build-context/Dockerfile
          cp helper/docker-bake.hcl build-context/docker-bake.hcl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push with Bake
        uses: docker/bake-action@v4
        with:
          workdir: build-context
          push: true
          files: |
            docker-bake.hcl
          set: |
            *.args.TAG=${{ steps.get_release.outputs.tag }}
            *.args.REGISTRY=${{ env.REGISTRY }}
            *.args.IMAGE_NAME=${{ env.IMAGE_NAME }}
