services:
  openalgo:
    build:
      context: .
      dockerfile: Dockerfile
    image: openalgo:local
    container_name: openalgo
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8765:8765"
    environment:
      - HOST_SERVER=${HOST_SERVER:-http://localhost:5000}
      - REDIRECT_URL=${REDIRECT_URL:-http://localhost:5000/broker/callback}
      - BROKER_API_KEY=${BROKER_API_KEY}
      - BROKER_API_SECRET=${BROKER_API_SECRET}
      - BROKER_API_KEY_MARKET=${BROKER_API_KEY_MARKET:-}
      - BROKER_API_SECRET_MARKET=${BROKER_API_SECRET_MARKET:-}
      - APP_KEY=${APP_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - PORT=5000
      - WEBSOCKET_PORT=8765
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - openalgo_db:/app/db
      - openalgo_logs:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/auth/check-setup || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  openalgo_db:
    name: openalgo_db
  openalgo_logs:
    name: openalgo_logs
  openalgo_strategies:
    name: openalgo_strategies
  openalgo_keys:
    name: openalgo_keys
